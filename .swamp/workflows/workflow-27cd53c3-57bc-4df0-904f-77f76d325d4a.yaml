id: 27cd53c3-57bc-4df0-904f-77f76d325d4a
name: daily-summary
description: Fetch PRs, generate summary, post to Discord
tags: {}
version: 1
jobs:
  - name: generate-and-post
    description: Generate summary and post to Discord
    weight: 0
    dependsOn: []
    steps:
      - name: fetch-prs
        description: Fetch closed PRs from GitHub
        weight: 0
        dependsOn: []
        task:
          type: model_method
          modelIdOrName: daily_pr_fetch_gh
          methodName: list

      - name: generate-summary
        description: Generate summary with Claude
        weight: 0
        dependsOn:
          - step: fetch-prs
            condition:
              type: succeeded
              ref: fetch-prs
        task:
          type: model_method
          modelIdOrName: daily_summary_generator
          methodName: generate

      - name: post-to-discord
        description: Post summary to Discord
        weight: 0
        dependsOn:
          - step: generate-summary
            condition:
              type: succeeded
              ref: generate-summary
        task:
          type: model_method
          modelIdOrName: daily_discord_post
          methodName: send
