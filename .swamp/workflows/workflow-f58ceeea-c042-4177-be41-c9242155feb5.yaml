id: f58ceeea-c042-4177-be41-c9242155feb5
name: generate-summary
description: Fetch PRs and generate a markdown summary (no Discord post)
tags: {}
version: 1
jobs:
  - name: main
    description: Fetch PRs and generate summary
    weight: 0
    dependsOn: []
    steps:
      - name: fetch-prs
        description: Fetch closed PRs from GitHub
        weight: 0
        dependsOn: []
        task:
          type: model_method
          modelIdOrName: daily_pr_fetch_gh
          methodName: list

      - name: generate-summary
        description: Generate markdown summary with Claude
        weight: 0
        dependsOn:
          - step: fetch-prs
            condition:
              type: succeeded
              ref: fetch-prs
        task:
          type: model_method
          modelIdOrName: daily_summary_generator
          methodName: generate
