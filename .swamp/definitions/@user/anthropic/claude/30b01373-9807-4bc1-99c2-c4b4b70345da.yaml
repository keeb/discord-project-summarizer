type: '@user/anthropic/claude'
typeVersion: 2026.02.14.1
id: 30b01373-9807-4bc1-99c2-c4b4b70345da
name: daily_summary_generator
version: 1
tags: {}
globalArguments:
  apiKey: ${{ vault.get("secrets", "ANTHROPIC_API_KEY") }}
  model: claude-sonnet-4-20250514
  systemPrompt: |
    You generate concise daily project summaries. Rules:
    - Follow the template exactly. No emojis. No code blocks.
    - Be extremely brief. Every word must earn its place.
    - Total output MUST be under 1500 characters. Count carefully.
  maxTokens: 768
methods:
  generate:
    arguments:
      prompt: |
        Today's date is ${{ model.daily_pr_fetch_gh.resource.result.result.attributes.fetchedAt }}.

        Here are the pull requests merged in the last 24 hours:

        ${{ model.daily_pr_fetch_gh.resource.result.result.attributes.pullRequests }}

        Generate a markdown summary using EXACTLY this template. No emojis. No code block wrapping.

        ---BEGIN TEMPLATE---
        # Daily Summary — {date as MMM DD, YYYY, e.g. Feb 24, 2026}

        ## Highlights
        {2-3 bullets, one short sentence each, summarizing key themes — not individual PRs}

        ## Changes
        {One bullet per PR:}
        - [#{number}]({url}) — {short phrase: what changed}

        ---END TEMPLATE---

        RULES:
        - Highlights: 2-3 bullets max. One sentence each, under 80 characters.
        - Changes: one bullet per PR. Use format "- [#N](url) — short phrase". No bold. No full sentences. Keep each bullet under 100 characters.
        - If more than 10 PRs, list only the 10 most significant and add a final bullet: "- ...and {N} more"
        - HARD LIMIT: total output must be under 1500 characters. This is a Discord message.
        - If there are no PRs, output only: "# Daily Summary — {date}\n\nNo changes in the last 24 hours."
